<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fdf1f4">
<title>今月の数字｜Merone</title>
<script>
/* Supabase認証の戻り（#access_token…）は旧ボードへハッシュごと転送 */
(function(){ try{ var h=location.hash||''; if(/access_token=|refresh_token=|error_description=/.test(h)){ location.replace('board.html'+location.search+h); } }catch(e){} })();
/* エラーを最初から拾う（?debug=1 で画面に出す） */
window.__errs=[];
window.__dbg=function(m){ try{ window.__errs.push(String(m).slice(0,300)); if(window.__dbgRender) window.__dbgRender(); }catch(e){} };
window.onerror=function(m,src,line,col){ window.__dbg('エラー: '+m+'（'+(line||0)+':'+(col||0)+'）'); };
window.addEventListener('unhandledrejection',function(e){ var r=e&&e.reason; window.__dbg('非同期エラー: '+((r&&r.message)||r)); });
</script>
<style>
:root{
  --plum:#574a58; --plum2:#463a48; --pink:#f0a2c5; --pinkd:#c66f96; --blue:#8fbfe6; --blued:#5f97be;
  --ink:#4f454e; --sub:#9a8993; --line:#f3e3ec; --paper:#ffffff; --bg2:#faf1f6; --pinkbg:#fbe7ef; --bluebg:#eef6fc; --lavbg:#f4eefb;
  --grad:linear-gradient(135deg,#F5A6C8,#B98BEA);
  --grad-lav:linear-gradient(150deg,#C99BE8,#9E77D6);
  --grad-blue:linear-gradient(135deg,#a9d0ef,#8fbfe6);
  --shadow:0 12px 28px -18px rgba(87,74,88,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
body{
  background:linear-gradient(180deg,#fdf1f4 0%,#fbe9ee 55%,#f3f0f7 100%); background-color:#fbe9ee;
  color:var(--ink); line-height:1.7; letter-spacing:.01em; min-height:100vh;
  font-family:"Yu Gothic","YuGothic","游ゴシック","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  display:flex; justify-content:center; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; -webkit-overflow-scrolling:touch;
}
button,input,select{font-family:inherit; color:inherit;}
button{cursor:pointer; touch-action:manipulation;}
img{max-width:100%; height:auto;}
.app{width:100%; max-width:480px; min-height:100vh; position:relative; padding-bottom:calc(120px + env(safe-area-inset-bottom));}
.num{font-variant-numeric:tabular-nums;}

/* header */
.hud{display:flex; align-items:center; gap:10px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--paper); border-bottom:1px solid var(--line); position:-webkit-sticky; position:sticky; top:0; z-index:20;
  box-shadow:0 6px 18px -14px rgba(87,74,88,.35);}
.hud .ava{flex:none; width:36px; height:36px; border-radius:999px; overflow:hidden; border:2px solid #fff; box-shadow:0 3px 10px rgba(198,111,150,.3); background:#fff;}
.hud .ava img{width:100%; height:100%; object-fit:cover; display:block;}
.hud h1{font-size:16px; font-weight:800; color:var(--plum2); letter-spacing:.04em; line-height:1.3;}
.hud .asof{font-size:10.5px; color:var(--sub); font-weight:700; line-height:1.3;}
.hud .mk{margin-left:auto; font-size:10px; font-weight:800; color:#fff; background:var(--grad); border-radius:999px; padding:4px 10px; white-space:nowrap;}

#note{margin:8px 16px 0; font-size:11px; font-weight:700; color:var(--plum); background:rgba(255,255,255,.75); border:1px dashed var(--line); border-radius:999px; padding:3px 12px; text-align:center;}

/* 3 numbers */
.top{padding:10px 16px 0;}
.nums{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.nc{display:flex; flex-direction:column; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:18px;
  padding:9px 4px 9px; text-align:center; box-shadow:var(--shadow); min-width:0;}
.nc .lb{font-size:10.5px; font-weight:800; color:#fff; border-radius:999px; padding:1px 10px; letter-spacing:.08em; background:var(--grad);}
.nc.mid .lb{background:var(--grad-lav);}
.nc.pro .lb{background:var(--grad-blue);}
.nc b{display:block; font-size:34px; font-weight:800; color:var(--plum2); line-height:1.15; margin-top:3px; letter-spacing:0; font-variant-numeric:tabular-nums;}
.nc b small{font-size:12px; font-weight:800; margin-left:1px; color:var(--plum);}
.nc .rg{font-size:11px; font-weight:800; color:var(--plum); line-height:1.3;}
.nc .ex{font-size:10px; color:var(--sub); font-weight:700; line-height:1.35; margin-top:2px; word-break:keep-all; overflow-wrap:anywhere;}
#snapLine{font-size:10.5px; color:var(--sub); font-weight:700; text-align:center; margin-top:6px;}
.whyline{margin-top:8px; font-size:11.5px; line-height:1.75; color:var(--plum); background:#fffafc; border:1px dashed #ecd3e0; border-radius:12px; padding:7px 11px; white-space:pre-line;}
[data-why]{cursor:pointer;}
.tap{border-bottom:1px dashed #d9bfd0;}

/* next move */
.next{display:flex; align-items:center; gap:10px; margin:10px 16px 0; background:var(--paper); border:2px solid var(--pink); border-radius:18px; padding:9px 14px; box-shadow:var(--shadow);}
.next .tg{flex:none; font-size:10px; font-weight:800; color:#fff; background:var(--grad); border-radius:999px; padding:2px 9px; letter-spacing:.06em;}
.next p{font-size:13.5px; font-weight:800; color:var(--plum2); line-height:1.55;}
.nextwrap .whyline{margin:6px 16px 0;}

/* sections */
section{padding:16px 16px 0;}
.sec-h{display:flex; align-items:center; gap:8px; margin:2px 2px 8px;}
.sec-h .tag{font-size:10px; font-weight:800; letter-spacing:.12em; color:#fff; background:var(--grad-lav); border-radius:999px; padding:2px 11px;}
.sec-h b{font-size:14px; color:var(--plum2); letter-spacing:.03em;}
.sec-h small{font-size:10.5px; color:var(--sub); font-weight:700; margin-left:auto;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);}
.pad{padding:14px 16px;}

/* PIN */
#pinCard{margin:10px 16px 0;}
#pinCard p{font-size:12px; color:var(--plum); margin-bottom:8px;}
.pinrow{display:flex; gap:8px;}
.pinrow input{flex:1; min-width:0; border:1.5px solid var(--line); background:#fffdfd; border-radius:13px; padding:10px 12px; font-size:16px; -webkit-appearance:none; appearance:none;}
.pinrow button{flex:none; border:none; border-radius:13px; padding:0 18px; font-size:14px; font-weight:800; color:#fff; background:var(--grad);}
#pinMsg{font-size:11.5px; color:var(--pinkd); font-weight:700; margin-top:6px;}

/* paid */
.paidrow{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.paidrow .k{font-size:12.5px; font-weight:800; color:var(--plum);}
.paidrow .big{font-size:30px; font-weight:800; color:var(--plum2); line-height:1.1; font-variant-numeric:tabular-nums;}
.paidrow .big small{font-size:13px; margin-left:2px;}
.paidrow .shi{margin-left:auto; font-size:10.5px; color:var(--sub); font-weight:700;}
.bar{position:relative; height:10px; border-radius:20px; background:#f6e7ef; margin:10px 0 4px;}
.bar i{position:absolute; left:0; top:0; bottom:0; border-radius:20px; background:linear-gradient(90deg,#b9daf3,var(--blue));}
.bar i.ok{background:linear-gradient(90deg,#f7c3da,var(--pink));}
.bar em{position:absolute; top:-4px; width:3px; height:18px; border-radius:3px; margin-left:-1.5px;}
.bar em.pro{background:var(--blued);}
.bar em.need{background:var(--pinkd);}
.legend{display:flex; gap:12px; font-size:10.5px; color:var(--sub); font-weight:700;}
.legend i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:0;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.chip{display:inline-block; font-size:11px; font-weight:800; color:var(--plum); background:var(--bg2); border:1px solid var(--line); border-radius:999px; padding:2px 10px; white-space:nowrap;}
.chip b{color:var(--plum2);}
.chip.blue{background:var(--bluebg); border-color:#d3e6f5; color:var(--blued);}
.chip.lav{background:var(--lavbg); border-color:#e5d7f5; color:#8a68c4;}
.chip.pink{background:var(--pinkbg); border-color:#f5d0e1; color:var(--pinkd);}
.chip.gray{background:#f5f2f4; border-color:#ece6ea; color:var(--sub);}

/* seminars */
.sem{padding:12px 14px; border-bottom:1px dashed var(--line);}
.sem:last-of-type{border-bottom:none;}
.semH{display:flex; align-items:center; gap:8px;}
.semH .d{font-size:14px; font-weight:800; color:var(--plum2);}
.semH .al{font-size:11px; font-weight:800; color:#fff; background:var(--grad); border-radius:999px; padding:1px 10px;}
.semH .del{margin-left:auto; border:none; background:none; font-size:11px; color:var(--sub); font-weight:700; padding:4px 2px;}
.semA{display:flex; align-items:baseline; gap:6px; font-size:12px; font-weight:700; color:var(--plum); margin-top:6px;}
.semA b{font-size:18px; color:var(--plum2); font-variant-numeric:tabular-nums;}
.semA small{font-size:10.5px; color:var(--sub);}
.semB{font-size:12px; color:var(--plum); line-height:1.8;}
.semB b{color:var(--plum2); font-variant-numeric:tabular-nums;}
.semB .sub{font-size:10.5px; color:var(--sub); font-weight:700;}
.addBtn{display:block; width:100%; border:1.5px dashed #e7c6d7; background:#fffafc; color:var(--pinkd); border-radius:14px; padding:10px; font-size:13px; font-weight:800; margin-top:10px;}
.semAdd{margin-top:10px; padding:12px 14px; background:var(--bg2); border-radius:14px; border:1px solid var(--line);}
.semAdd label{display:block; font-size:11.5px; font-weight:800; color:var(--plum); margin-bottom:8px;}
.semAdd input,.semAdd select{display:block; width:100%; margin-top:3px; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:9px 11px; font-size:16px; -webkit-appearance:none; appearance:none; min-height:42px;}
.btnrow{display:flex; gap:8px;}
.btnrow button{flex:1; border:none; border-radius:999px; padding:10px; font-size:13px; font-weight:800;}
.btn-main{background:var(--grad); color:#fff; box-shadow:0 8px 18px -8px rgba(185,139,234,.6);}
.btn-sub{background:#f3eef2; color:var(--plum);}

/* range */
input[type=range]{-webkit-appearance:none; appearance:none; display:block; width:100%; height:30px; background:transparent; margin:2px 0; touch-action:pan-y;}
input[type=range]:focus{outline:none;}
input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:8px; background:linear-gradient(90deg,#c9e1f5,var(--pink));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:2px solid var(--pinkd); margin-top:-9px; box-shadow:0 2px 6px rgba(87,74,88,.25);}
input[type=range]::-moz-range-track{height:8px; border-radius:8px; background:linear-gradient(90deg,#c9e1f5,var(--pink));}
input[type=range]::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid var(--pinkd);}
input[type=range]:disabled{opacity:.35;}

/* ad */
.adGuard{text-align:center; padding:2px 0 10px; border-bottom:1px dashed var(--line);}
.adGuard .lb{font-size:11px; font-weight:800; color:var(--pinkd); letter-spacing:.08em;}
.adGuard b{display:block; font-size:30px; font-weight:800; color:var(--plum2); line-height:1.2; font-variant-numeric:tabular-nums;}
.adGuard small{display:block; font-size:10.5px; color:var(--sub); font-weight:700; line-height:1.6;}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.kv > div{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:8px 10px; min-width:0;}
.kv span{display:block; font-size:10.5px; font-weight:800; color:var(--sub); line-height:1.4;}
.kv b{display:block; font-size:17px; font-weight:800; color:var(--plum2); line-height:1.35; font-variant-numeric:tabular-nums;}
.kv small{display:block; font-size:10px; color:var(--sub); font-weight:700; line-height:1.4;}
.try{margin-top:12px; padding:10px 12px 6px; border-radius:14px; background:#fffafc; border:1px solid var(--line);}
.tryH{display:flex; align-items:baseline; gap:6px; font-size:12px; font-weight:800; color:var(--plum);}
.tryH b{font-size:15px; color:var(--plum2); font-variant-numeric:tabular-nums;}
.tryH button{margin-left:auto; border:none; background:none; font-size:11px; font-weight:700; color:var(--sub); padding:2px;}
.tryOut{font-size:11.5px; color:var(--plum); font-weight:700;}
.inl{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--plum); margin-top:10px;}
.inl input{width:110px; border:1.5px solid var(--line); background:#fffdfd; border-radius:12px; padding:7px 10px; font-size:16px; -webkit-appearance:none; appearance:none;}

/* visible */
.tr{display:flex; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line);}
.tr:last-child{border-bottom:none;}
.tr .k{font-size:12.5px; font-weight:800; color:var(--plum);}
.tr .k small{display:block; font-size:10px; color:var(--sub); font-weight:700; line-height:1.4;}
.tr .n{margin-left:auto; font-size:12px; color:var(--plum); font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
.tr .n b{font-size:15px; color:var(--plum2);}
.tot{display:flex; justify-content:space-between; font-size:11.5px; font-weight:800; color:var(--plum); background:var(--bg2); border-radius:10px; padding:4px 10px; margin-bottom:4px;}
.tot + .tr{margin-top:0;}
.sep{height:12px;}

/* dates */
.dates{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.dchip{display:block; border:1px solid var(--line); background:var(--paper); border-radius:16px; padding:8px 4px; text-align:center; box-shadow:var(--shadow);}
.dchip span{display:block; font-size:10.5px; font-weight:800; color:var(--sub);}
.dchip b{display:block; font-size:14px; font-weight:800; color:var(--plum2); font-variant-numeric:tabular-nums;}

/* details */
details.card{overflow:hidden;}
details > summary{list-style:none; display:flex; align-items:center; gap:8px; padding:13px 16px; font-size:13.5px; font-weight:800; color:var(--plum2); cursor:pointer;}
details > summary::-webkit-details-marker{display:none;}
details > summary::after{content:""; width:8px; height:8px; border-right:2px solid var(--pinkd); border-bottom:2px solid var(--pinkd); -webkit-transform:rotate(45deg); transform:rotate(45deg); margin-left:8px; margin-top:-4px;}
details[open] > summary::after{-webkit-transform:rotate(-135deg); transform:rotate(-135deg); margin-top:4px;}
details > summary .st{margin-left:auto; font-size:10.5px; font-weight:800; color:var(--sub);}
.dbody{padding:0 16px 16px;}
.fld{display:block; padding:8px 0 4px;}
.fld .fl{display:flex; align-items:baseline; gap:6px; font-size:12.5px; font-weight:800; color:var(--plum2);}
.fld .fl small{font-size:10.5px; color:var(--sub); font-weight:700;}
.fld .iw{display:flex; align-items:center; gap:6px; margin-top:4px;}
.fld input:disabled{background:#f6f1f4; color:#b9a9b3;}
.fld input{flex:1; min-width:0; border:1.5px solid var(--line); background:#fffdfd; border-radius:13px; padding:10px 12px; font-size:16px; -webkit-appearance:none; appearance:none;}
.fld input:focus,.pinrow input:focus,.inl input:focus{outline:none; border-color:var(--pink); box-shadow:0 0 0 3px rgba(240,162,197,.18);}
.fld .u{flex:none; font-size:12px; font-weight:800; color:var(--plum);}
.fld .hint{font-size:10.5px; color:var(--sub); font-weight:700; margin-top:2px;}
.autov{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:4px;}
.autov b{font-size:18px; font-weight:800; color:var(--plum2); font-variant-numeric:tabular-nums;}
.autov small{font-size:10.5px; color:var(--sub); font-weight:700;}
.items{margin:6px 0 2px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:6px 10px;}
.items .it{display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--plum); padding:2px 0; border-bottom:1px dashed var(--line);}
.items .it:last-child{border-bottom:none;}
.items .it b{font-variant-numeric:tabular-nums; color:var(--plum2); white-space:nowrap;}
.items .it.sub{color:var(--sub); font-size:10.5px;}
.sw{display:flex; align-items:flex-start; gap:10px; padding:10px 0 4px; font-size:12.5px; font-weight:800; color:var(--plum2);}
.sw input{width:22px; height:22px; margin-top:1px; accent-color:#c66f96; flex:none;}
.sw small{display:block; font-size:10.5px; color:var(--sub); font-weight:700;}
.calc small{display:block; font-size:10.5px; color:var(--sub); font-weight:700; margin-top:4px; line-height:1.6;}
.calc{margin-top:10px; font-size:12px; font-weight:800; color:var(--plum2); background:var(--bg2); border-radius:12px; padding:8px 12px;}
.bigbtn{display:block; width:100%; border:none; padding:13px; border-radius:16px; font-size:15px; font-weight:800; letter-spacing:.06em; background:var(--grad); color:#fff; box-shadow:0 10px 24px -10px rgba(185,139,234,.7); margin-top:12px;}
.bigbtn[disabled]{opacity:.6;}
.snapNow{font-size:12px; color:var(--plum); line-height:1.8;}
.snapNow b{color:var(--plum2);}

/* settings */
.sg{font-size:11px; font-weight:800; color:#fff; background:var(--grad-lav); display:inline-block; border-radius:999px; padding:1px 11px; margin:14px 0 4px; letter-spacing:.06em;}
.sr{padding:6px 0 2px; border-bottom:1px dashed var(--line);}
.srh{display:flex; align-items:baseline; gap:8px;}
.srh .sl{font-size:12px; font-weight:800; color:var(--plum2);}
.srh .sv{margin-left:auto; font-size:13px; font-weight:800; color:var(--pinkd); font-variant-numeric:tabular-nums; white-space:nowrap;}
.srh .si{margin-left:auto; display:flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800; color:var(--plum);}
.srh .si input{width:96px; border:1.5px solid var(--line); background:#fffdfd; border-radius:10px; padding:5px 8px; font-size:16px; text-align:right; -webkit-appearance:none; appearance:none;}
.sr .src{display:block; font-size:10px; color:var(--sub); font-weight:700; line-height:1.4; padding-bottom:4px;}
.setfoot{display:flex; gap:8px; margin-top:14px; align-items:center;}
.linkbtn{border:none; background:none; color:var(--pinkd); font-size:12px; font-weight:800; text-decoration:underline; padding:6px 2px;}

/* footer */
.foot{padding:22px 16px 10px; text-align:center;}
.hc{border:1.5px solid #ead0de; background:#fff; color:var(--plum2); border-radius:999px; padding:10px 20px; font-size:13px; font-weight:800; box-shadow:var(--shadow);}
#hcOut{list-style:none; margin:12px auto 0; max-width:420px; text-align:left;}
#hcOut li{display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--plum); background:#fff; border:1px solid var(--line); border-radius:12px; padding:7px 10px; margin-top:6px; line-height:1.6;}
#hcOut li .r{flex:none; font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 9px; color:#fff; background:#cdbfc8; margin-top:1px;}
#hcOut li .r.ok{background:var(--grad-blue);}
#hcOut li .r.ng{background:var(--grad);}
#hcOut li small{display:block; font-size:10.5px; color:var(--sub);}
.links{margin-top:16px; font-size:12px; font-weight:700; color:var(--sub);}
.links a{color:var(--pinkd); text-decoration:underline;}
.ver{font-size:10px; color:#c4b5be; margin-top:8px;}

/* save bar */
#saveBar{position:fixed; left:50%; -webkit-transform:translateX(-50%); transform:translateX(-50%); bottom:calc(54px + env(safe-area-inset-bottom)); z-index:60;
  width:calc(100% - 32px); max-width:448px; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.97); border:1.5px solid var(--pink);
  border-radius:999px; padding:6px 6px 6px 16px; box-shadow:0 12px 28px -12px rgba(87,74,88,.45);}
#saveBar span{font-size:12px; font-weight:800; color:var(--plum);}
#saveBar button{margin-left:auto; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:800; color:#fff; background:var(--grad);}
#saveBar button[disabled]{opacity:.6;}

/* toast */
#toast{position:fixed; left:50%; -webkit-transform:translateX(-50%); transform:translateX(-50%); bottom:calc(110px + env(safe-area-inset-bottom)); z-index:80;
  background:rgba(70,58,72,.92); color:#fff; font-size:12px; font-weight:700; border-radius:999px; padding:9px 18px; max-width:86vw; text-align:center;}

/* bug tool */
#bugL{position:fixed; left:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:59; background:rgba(255,255,255,.92); border:1px solid #eadfe7; color:#a2949d; font-size:10.5px; font-weight:800; border-radius:999px; padding:5px 12px; letter-spacing:.04em;}

<script>
(function(){
'use strict';
var GAS='https://script.google.com/macros/s/AKfycbxVKavyoHzLaGV2a0HO6R_lAq1z7JvPtuEEtIuDndf8DzB-E9jHCTivdO8qq3MyItsi/exec';
var SB_URL='https://inrvprlyobghviklulcv.supabase.co/rest/v1/ailab_notes';
var SB_KEY='sb_publishable_ZrCNcsRHMci-l7Fns8QtIA_X22XZGJp';
var Q; try{ Q=new URLSearchParams(location.search); }catch(e){ Q={ get:function(){ return null; } }; }
var MOCK=Q.get('mock')==='1', DEBUG=Q.get('debug')==='1';
var K_PIN='cockpit_pin', K_CACHE=MOCK?'cockpit_cache_v1_mock':'cockpit_cache_v1';
var MOCK_META = Q.get('meta')==='0' ? { ok:false, error:'token未設定' } : { ok:true, spend:1130000, regs:226, cpl:5000, since:'2026-11-01', until:'2026-11-10', error:'' };
var SEED={ '2026-11':[
  { id:'s1', alliance:'famm', date:'2026-11-18', attend:null, note:'' },
  { id:'s2', alliance:'ABCash', date:'2026-11-21', attend:null, note:'' },
  { id:'s3', alliance:'famm', date:'2026-11-28', attend:null, note:'' } ] };
var SEED_SNAP={ '2026-11':{ date:'2026-11-01', need:45, low:24, mid:33, high:42, promise:33, note:'月初の原文' } };
var BUILD = '20261110b'; // engine.js?v= と E.VERSION を同じにする
var E=window.CockpitEngine;
var memPin='';
var SECS=['cash','seminars','ads','rates','manual','promiseManual','snapshots','expense'];
var st={ ym:'', today:null, settings:null, stat:null, meta:null, asOf:'', fetchedAt:0, settingsUpdated:'',
  expense:null, dirty:false, pending:false, changeN:0, secs:{}, loading:false, saving:false, loadFail:'',
  lastSaveOkAt:0, lastLoadAt:0, cplTry:null, res:null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hm(ts){ var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+pad(d.getMinutes()); }
function mdOf(iso){ var a=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(iso||'')); return a ? (+a[2])+'/'+(+a[3]) : ''; }
function clone(x){ return x==null ? x : JSON.parse(JSON.stringify(x)); }
function isNum(x){ return typeof x==='number' && isFinite(x); }
function f1(x){ return isNum(x) ? E.f1(x) : '—'; }
function pctS(x){ return isNum(x) ? Math.round(x*100)+'%' : '—'; }
function dlog(m){ window.__dbg(m); }

/* ---------- 端末の保存（すべて try/catch） ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function getPin(){ return lsGet(K_PIN) || memPin || ''; }
function readCache(){ try{ var c=JSON.parse(lsGet(K_CACHE)||'null'); return c && typeof c==='object' ? c : null; }catch(e){ return null; } }
var cacheTimer=null;
function writeCacheNow(){ lsSet(K_CACHE, JSON.stringify({ v:1, ym:st.ym, settings:st.settings, settingsUpdated:st.settingsUpdated, secs:st.secs, stat:st.stat, meta:st.meta, expense:st.expense, asOf:st.asOf, fetchedAt:st.fetchedAt, dirty:st.dirty, pending:st.pending })); }
function writeCache(){ if(cacheTimer) clearTimeout(cacheTimer); cacheTimer=setTimeout(function(){ cacheTimer=null; writeCacheNow(); }, 400); }

/* ---------- 画面のお知らせ ---------- */
var toastTimer=null;
function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false; if(toastTimer) clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; }, 2600); }
function setNote(kind){
  var n=$('note'), tx='', local = st.fetchedAt ? '手元の数字（'+hm(st.fetchedAt)+'）' : 'まだ実績を読めていません';
  if(kind==='fail') tx = (st.loadFail==='net' ? '電波が届いていないようです。' : st.loadFail==='app' ? '表示でつまずきました。' : 'サーバー側の準備中です。')+local;
  else if(kind==='cache') tx = st.fetchedAt ? local : 'まだ実績を読めていません。電波のよい所で開き直すと入ります';
  else if(kind==='loading') tx='最新の実績を読み込み中…';
  else if(kind==='mock') tx='お試し表示（サンプルの数字・保存はこの端末だけ）';
  else if(kind==='nopin') tx='PINを入れると実績が入ります';
  else if(kind==='staterr') tx='セールス管理シートが読めませんでした。'+local;
  n.textContent=tx; n.hidden=!tx;
}
function removeBoot(){ var b=$('boot'); if(b && b.parentNode) b.parentNode.removeChild(b); }

/* ---------- 計算と描画 ---------- */
function compute(){ st.res=E.compute(st.settings, st.stat, st.meta, st.today, { cplTry:st.cplTry, expense:st.expense }); return st.res; }

function whyText(k){
  var r=st.res; if(!r) return '';
  var w=r.why||{};
  if(k==='mid') return (w.mid||'')+'\n'+(w.range||'');
  if(k==='ad') return (w.ad||'')+(w.budget?'\n'+w.budget:'');
  if(k==='next'){
    if(r.nextKind==='input') return '入力を開きました。残高・残りの支払い・残す額を入れてください';
    return w.next ? '上積みの比較: '+w.next : (w.gap||'約束の数字と必要数を比べています');
  }
  return w[k] || '';
}
function refreshWhy(){
  var ls=document.querySelectorAll('.whyline');
  for(var i=0;i<ls.length;i++){ var k=ls[i].getAttribute('data-k'); if(k && !ls[i].hidden) ls[i].textContent=whyText(k); }
}

function renderHead(){
  var r=st.res;
  $('hMonth').textContent=r.m+'月の数字';
  $('hAsOf').textContent= st.asOf ? '実績 '+st.asOf+' 更新' : '実績 まだ読み込んでいません';
  $('hMock').hidden=!MOCK;
}
function renderNums(){
  var r=st.res, has=!!st.stat;
  var keepS=E.fmtMan(r.keep).replace('万円','万');
  var h='';
  h+='<button type="button" class="nc need" data-why="need"><span class="lb">必要</span><b>'+(r.need==null?'—':r.need+'<small>件</small>')+'</b>'
    +'<span class="ex">'+(r.need==null?(r.unitMissing?'着金額を入れると出ます':r.spendMissing&&r.expenseState==='error'?'支払いを入れると出ます':r.balanceStart==null?'月初残高を入れると出ます':'経費シートの読み込み待ち'):'口座に'+esc(keepS)+'残す数')+'</span></button>';
  h+='<button type="button" class="nc mid" data-why="mid"><span class="lb">見込み</span><b>'+(has?r.mid+'<small>件</small>':'—')+'</b>'
    +'<span class="rg">'+(has?r.low+'〜'+r.high:'読み込み待ち')+'</span><span class="ex">流入×率</span></button>';
  h+='<button type="button" class="nc pro" data-why="promise"><span class="lb">約束</span><b>'+((has||r.promiseIsManual)?r.promise+'<small>件</small>':'—')+'</b>'
    +'<span class="ex">会社に出す数字</span></button>';
  $('nums').innerHTML=h;
  var sl=$('snapLine'), s=r.snapshot;
  if(s){ sl.textContent='月初 '+mdOf(s.date)+': 必要'+(s.need==null?'—':s.need)+'・見込み'+s.mid+'（'+s.low+'〜'+s.high+'）・約束'+s.promise; sl.hidden=false; }
  else sl.hidden=true;
}
function renderNext(){
  var r=st.res, tx=r.nextMove;
  if(!st.stat && r.inputsReady) tx='実績を読み込むと次の一手が出ます';
  $('nextTx').textContent=tx;
}
function renderPaid(){
  var r=st.res, max;
  if(r.need!=null) max=Math.max(r.need, r.paid, 1); else max=Math.max(r.high, r.promise, r.paid, 1);
  var w=Math.min(100, r.paid/max*100), cleared=r.paid>=r.promise && st.stat;
  var h='<div class="paidrow"><span class="k">入金済み</span><span class="big" data-why="paid">'+r.paid+'<small>件</small></span>'
    +(r.shiire?'<span class="shi">仕入れコース 別枠 '+r.shiire+'件</span>':'')+'</div>';

  if(r.need!=null) h+='<em class="need" style="left:100%"></em>';
  h+='</div><div class="legend"><span>0</span>'
    +(st.stat?'<span><i style="background:#5f97be"></i>約束 '+r.promise+'</span>':'')
    +(r.need!=null?'<span><i style="background:#c66f96"></i>必要 '+r.need+'</span>':'')+'</div>';
  var pv=r.paidByVia||{};
  var keys=Object.keys(pv).filter(function(k){ return pv[k]>0; }).sort(function(a,b){ return pv[b]-pv[a]; });
  if(keys.length){
    h+='<div class="chips">';
    keys.forEach(function(k){ h+='<span class="chip">'+esc(k)+' <b>'+pv[k]+'</b></span>'; });
    h+='</div>';
  }
  if(r.paidOverridden) h+='<div class="legend" style="margin-top:6px">手で直した数を使っています（自動 '+r.paidAuto+'件）</div>';

/* 勉強会: 構造は buildSeminars、数字は renderSemDyn */
function semMax(s){ var med=0; try{ med=st.settings.rates.seminar[E.viaKey(s.alliance)].attendMedian||0; }catch(e){} return Math.max(60, Math.ceil(med*2.5), (s.attend||0)+10); }
function buildSeminars(){
  var list=(st.settings.seminars||[]).slice().sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  st.settings.seminars=list;
  var h='';
  if(!list.length) h='<div class="sem"><div class="semB"><span class="sub">今月の勉強会はまだありません。下の「＋勉強会を足す」から入れられます</span></div></div>';
  list.forEach(function(s){
    var id=esc(s.id);
    h+='<div class="sem whyhost" data-id="'+id+'">'
      +'<div class="semH"><b class="d" id="semD_'+id+'"></b><span class="al">'+esc(E.viaKey(s.alliance))+'</span><button type="button" class="del" data-del="'+id+'">外す</button></div>'
      +'<div class="semA" id="semA_'+id+'"></div>'
      +'<input type="range" data-sem="'+id+'" min="0" max="'+semMax(s)+'" step="1" aria-label="参加人数">'
      +'<div class="semB" id="semB_'+id+'"></div>'
      +'<div class="whyline" hidden></div></div>';
  });
  $('semList').innerHTML=h;
}
function renderSemDyn(){
  var r=st.res;
  $('semTitle').textContent='勉強会（'+r.seminars.length+'回）';
  r.seminars.forEach(function(s){
    var a=$('semA_'+s.id), b=$('semB_'+s.id), d=$('semD_'+s.id);

/* ---------- 通信 ---------- */
function fail(kind, msg){ var e=new Error(msg||kind); e.kind=kind; return e; }
function fetchJSON(url, opt, ms){
  return new Promise(function(resolve, reject){
    var done=false, ctrl=null;
    try{ ctrl=new AbortController(); }catch(e){ ctrl=null; }
    var o={}; for(var k in (opt||{})) o[k]=opt[k];
    if(ctrl) o.signal=ctrl.signal;
    var t=setTimeout(function(){ if(done) return; done=true; try{ if(ctrl) ctrl.abort(); }catch(e){} reject(fail('net','timeout')); }, ms||25000);
    fetch(url, o).then(function(res){ return res.text(); }).then(function(tx){
      if(done) return; done=true; clearTimeout(t);
      var j; try{ j=JSON.parse(tx); }catch(e){ reject(fail('server','unreadable reply')); return; }
      resolve(j);
    }).catch(function(e){ if(done) return; done=true; clearTimeout(t); reject(fail('net',(e&&e.message)||String(e))); });
  });
}
function loadMock(){
  return new Promise(function(resolve, reject){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','mock_stat.json?_='+Date.now(),true);
      x.onload=function(){ if((x.status===200||x.status===0) && x.responseText){ try{ var s=JSON.parse(x.responseText), ex=s.expense||null; delete s.expense; if(Q.get('expense')==='0') ex={ ok:false, ym:s.ym, error:'11月の列が見つかりません' }; resolve({ ok:true, asOf:s.asOf||'', ym:s.ym, stat:s, settings:null, settingsUpdated:null, meta:MOCK_META, expense:ex }); }catch(e){ reject(fail('server','mock unreadable')); } } else reject(fail('net','mock missing')); };
      x.onerror=function(){ reject(fail('net','mock error')); };
      x.send();
    }catch(e){ reject(fail('net',e.message)); }
  });
}
function getCockpit(){
  if(MOCK) return loadMock();
  var tab=String((st.settings.expense&&st.settings.expense.tab)||'').trim();
  return fetchJSON(GAS+'?ll=cockpit&pin='+encodeURIComponent(getPin())+'&ym='+st.ym+(tab?'&etab='+encodeURIComponent(tab):'')+'&_='+Date.now(), { method:'GET', redirect:'follow' });
}
function postSettings(obj, extra){
  return fetchJSON(GAS+'?ll=cockpit_save&pin='+encodeURIComponent(getPin())+(extra||''), { method:'POST', body:JSON.stringify(obj), redirect:'follow' });
}

/* 読み込んだ結果を反映。startedAt＝その読み込みを始めた時刻（最後の保存より前なら設定は使わない） */
function applyData(j, startedAt){
  var statOk = !!(j.stat && !j.stat.error && isNum(j.stat.paidMainCount));
  if(statOk){ st.stat=j.stat; st.asOf=j.asOf || j.stat.asOf || st.asOf; st.fetchedAt=Date.now(); }
  if(j.expense) st.expense=j.expense;
  else if(j.stat && j.stat.error) dlog('実績: '+j.stat.error);
  if(j.meta) st.meta=j.meta;
  var rebuild=false, fresh = startedAt >= st.lastSaveOkAt && !st.dirty && !st.pending && !j.settingsError;
  if(fresh && j.settings){
    var ns=E.normalize(j.settings, st.ym);
    st.settingsUpdated = j.settingsUpdated || '';
    st.secs={};
    if(JSON.stringify(ns)!==JSON.stringify(st.settings)){ st.settings=ns; rebuild=true; }
  } else if(j.settingsError) dlog('設定: '+j.settingsError);
  writeCacheNow();
  if(rebuild) renderAll(); else render();
  setNote(MOCK ? 'mock' : (statOk ? '' : 'staterr'));
}
function refresh(){
  if(!MOCK && !getPin()){ showPin(''); renderInputsDyn(); return Promise.resolve(); }
  var startedAt=Date.now(); st.lastLoadAt=startedAt; st.loading=true; renderInputsDyn();
  if(!st.fetchedAt) setNote('loading');
  return getCockpit().then(function(j){
    if(j && j.error==='pin'){ onPinError(); return; }
    if(!j || j.ok!==true) throw fail('server','not ok '+((j&&j.error)||''));
    $('pinCard').hidden=true; $('pinMsg').textContent='';
    st.loadFail='';
    applyData(j, startedAt);
  }).catch(function(e){
    st.loadFail=(e&&e.kind)||'app';
    dlog('読み込み: '+st.loadFail+' '+((e&&e.message)||e));
    setNote('fail');
    if(!$('pinCard').hidden) $('pinMsg').textContent = st.loadFail==='net' ? 'つながりませんでした。電波のよい所でもう一度お試しください' : 'サーバー側の準備中です。少し待ってからもう一度お試しください';
  }).then(function(){ st.loading=false; renderInputsDyn(); removeBoot(); });
}

/* 保存。base＝読み込んだ設定の updated。ふだんの保存は月初の原文を送らない（サーバーの原文を守る） */
function payload(){ var b=E.mirrorCash(st.settings); b.snapshots={}; return b; }
function saveMsg(e){
  var k=e&&e.kind;
  return k==='pin' ? 'PINを入れ直すと保存できます' : k==='net' ? 'つながらず保存できませんでした。この端末には残っています' : '保存できませんでした。この端末には残っています';
}
function save(o){
  o=o||{};
  if(st.saving) return Promise.resolve(false);
  var startN=st.changeN;
  if(MOCK){
    st.settings = E.mirrorCash(o.adopt && o.body ? E.normalize(o.body, st.ym) : st.settings);
    st.dirty=false; st.pending=false; st.secs={}; st.lastSaveOkAt=Date.now(); writeCacheNow(); renderAll();
    if(!o.silent) toast(o.okMsg || '保存しました（お試し表示なので、この端末だけ）');
    return Promise.resolve(true);
  }
  if(!getPin()){ showPin('保存にはPINが要ります'); $('pinCard').scrollIntoView({ behavior:'smooth', block:'center' }); return Promise.resolve(false); }
  st.saving=true; renderSaveBar();
  var body=o.body ? E.mirrorCash(o.body) : payload();
  var q='&base='+encodeURIComponent(st.settingsUpdated||'')+(o.force?'&force=1':'');
  return postSettings(body, q).then(function(j){
    if(j && j.error==='pin'){ onPinError(); throw fail('pin'); }
    if(j && j.ok===false && j.error==='conflict'){ st.saving=false; return onConflict(j, o); }
    if(!j || j.ok!==true) throw fail('server', 'save '+((j&&j.error)||''));
    st.settingsUpdated=j.updated||st.settingsUpdated; st.lastSaveOkAt=Date.now(); st.pending=false;
    if(st.changeN===startN){
      st.settings = o.adopt && o.body ? E.normalize(body, st.ym) : E.mirrorCash(st.settings);
      st.dirty=false; st.secs={};
    } else if(o.adopt && o.body) st.settings.snapshots=clone(o.body.snapshots);
    writeCacheNow();
    if(o.adopt) renderAll(); else render();
    if(!o.silent) toast(o.okMsg || '保存しました');
    return true;
  }).catch(function(e){
    st.pending=true; writeCacheNow();
    dlog('保存: '+((e&&e.kind)||'')+' '+((e&&e.message)||e));
    if(!o.silent) toast(saveMsg(e));
    return false;
  }).then(function(r){ st.saving=false; renderSaveBar(); return r; });
}
/* 別の端末が先に保存していた: サーバーの内容を土台に、この端末で触った区分だけ重ねて1回だけ保存し直す */
function onConflict(j, o){
  if(o.retried || !j.settings){
    st.pending=true; writeCacheNow();
    toast('別の端末と同時に保存されました。もう一度「保存する」を押してください');
    return false;
  }
  var merged=E.normalize(j.settings, st.ym);
  SECS.forEach(function(k){ if(st.secs[k] && k!=='snapshots') merged[k]=clone(st.settings[k]); });
  st.settings=merged; st.settingsUpdated=j.updated||'';
  writeCacheNow(); renderAll();
  toast('別の端末の保存を取り込みました');
  var next={ silent:o.silent, retried:true, force:o.force, adopt:o.adopt, okMsg:'別の端末の保存を取り込みました' };
  if(o.body){ var b=clone(merged); b.snapshots=o.body.snapshots; next.body=b; }
  return save(next);
}

/* 月初の原文: サーバーの今の原文を読み直してから固定。違う原文があればアプリ内で確認してから force=1 */
function fixSnapshot(){
  if(!st.stat){ toast('実績を読み込んでから固定できます'); return; }
  var snap=E.makeSnapshot(st.res, isoDate(st.today), assumptions());
  function same(a,b){ return a && b && a.need===b.need && a.low===b.low && a.mid===b.mid && a.high===b.high && a.promise===b.promise; }
  function ask(ex){ return askConfirm('今月はもう '+mdOf(ex.date)+' の原文（必要'+(ex.need==null?'—':ex.need)+'・見込み'+ex.mid+'・約束'+ex.promise+'）があります。今の数字で置き換えますか？','置き換える'); }
  if(MOCK){
    var lx=st.settings.snapshots[st.ym];
    if(same(lx,snap)){ toast('同じ数字で固定ずみです'); return; }
    (lx ? ask(lx) : Promise.resolve(true)).then(function(yes){ if(!yes) return; st.settings.snapshots[st.ym]=snap; markChanged('snapshots'); save({ okMsg:'月初の原文として固定しました' }); });
    return;
  }
  if(!getPin()){ showPin('固定にはPINが要ります'); return; }
  var btn=$('snBtn'); btn.disabled=true;
  getCockpit().then(function(j){
    if(j && j.error==='pin'){ onPinError(); throw fail('pin'); }
    if(!j || j.ok!==true || j.settingsError) throw fail('server','snapshot get');
    var srv = j.settings ? E.normalize(j.settings, st.ym) : null;
    var snaps = (j.settings && j.settings.snapshots) || {}, ex = snaps[st.ym];
    function doSave(force){
      var body = srv ? srv : clone(st.settings);
      if(srv) SECS.forEach(function(k){ if(st.secs[k] && k!=='snapshots') body[k]=clone(st.settings[k]); });
      body.snapshots=clone(snaps); body.snapshots[st.ym]=snap;
      st.settingsUpdated = j.settingsUpdated || '';
      return save({ body:body, force:force, adopt:true, okMsg:'月初の原文として固定しました' });
    }
    if(same(ex,snap)){ toast('同じ数字で固定ずみです'); return; }
    if(ex) return ask(ex).then(function(yes){ if(yes) return doSave(true); });
    return doSave(false);
  }).catch(function(e){
    dlog('原文: '+((e&&e.kind)||'')+' '+((e&&e.message)||e));
    toast(e&&e.kind==='net' ? 'つながらず固定できませんでした' : '固定できませんでした。少し待ってからもう一度お試しください');
  }).then(function(){ btn.disabled=false; });
}

  });
  $('inFields').addEventListener('change', function(e){
    var b=e.target.getAttribute('data-cashb'); if(!b) return;
    st.settings.cash[b]=!!e.target.checked; touched('cash');
  });
  $('inFields').addEventListener('click', function(e){
    var g=e.target; if(!g || !g.getAttribute) return;
    var it=g.getAttribute('data-items');
    if(it){ var l=$(it+'Items'); l.hidden=!l.hidden; if(!l.hidden) l.innerHTML=itemsHtml(it); return; }
    var tg=g.getAttribute('data-toggle'); if(!tg) return;
    var a=AUTO[tg], c=st.settings.cash, inp=document.querySelector('input[data-ov="'+a.ov+'"]');
    if(isNum(c[a.ov]) || uiManual[tg]){ c[a.ov]=null; uiManual[tg]=false; if(inp) inp.value=''; touched('cash'); }
    else { uiManual[tg]=true; if(inp){ var v = tg==='spend' ? st.res.spend : st.res.otherIncome; inp.value=manVal(v); } render(); if(inp) inp.focus(); }
  });
  $('inSave').addEventListener('click', function(){ save(); });
  $('saveBtn').addEventListener('click', function(){ save(); });
  // 月初の原文
  $('snBtn').addEventListener('click', fixSnapshot);
  // 設定: スライダーは動かしている間は試し表示、指を離したら変更として記録
  function setVal(t, p, rv){
    var n=parseFloat(rv), v;
    if(t==='man') v = isNum(n) ? Math.round(n*10000) : getP(E.defaults(st.ym), p);
    else if(t==='optman') v = isNum(n) ? Math.round(n*10000) : null;
    else if(t==='opt') v = isNum(n) ? n : null;
    else if(t==='text') v = String(rv||'').trim();
    else v = isNum(n) ? n : 0;
    setP(st.settings, p, v);
    return v;
  }
  $('setFields').addEventListener('input', function(e){
    var p=e.target.getAttribute('data-p'); if(!p) return;
    var t=e.target.getAttribute('data-t'), v=setVal(t, p, e.target.value);
    var i=e.target.getAttribute('data-i'); if(i!=null){ var sv=$('sv_'+i); if(sv) sv.textContent=fmtSet(t,v); }
    if(e.target.type==='range') render(); else touched(p.split('.')[0]);
  });
  $('setFields').addEventListener('change', function(e){
    var p=e.target.getAttribute('data-p'); if(!p) return;
    if(e.target.getAttribute('data-t')==='text'){ refresh(); return; }
    if(e.target.type!=='range') return;
    setVal(e.target.getAttribute('data-t'), p, e.target.value);
    touched(p.split('.')[0]);
  });
  $('setReset').addEventListener('click', function(){
    askConfirm('率と広告の設定を既定に戻しますか？（入力・勉強会・月初の原文はそのまま）','戻す').then(function(yes){
      if(!yes) return;
      var d=E.defaults(st.ym), keepCpl=st.settings.ads.cplManual;
      st.settings.rates=d.rates; st.settings.ads=d.ads; st.settings.ads.cplManual=keepCpl;
      markChanged('rates'); markChanged('ads'); renderAll();
    });
  });
  // ヘルスチェック
  $('hcBtn').addEventListener('click', health);
  // 不具合を報告（本文・URL・端末の種類だけ。エラーの記録は ?debug=1 の時だけ添える）
  var M=$('bugM');
  $('bugL').addEventListener('click', function(){ M.classList.add('on'); });
  $('bugC').addEventListener('click', function(){ M.classList.remove('on'); $('bugD').style.display='none'; });
  $('bugS').addEventListener('click', function(){
    var t=$('bugT').value.trim();
    if(!t){ $('bugT').focus(); return; }
    var btn=this; btn.disabled=true;
    function done(){
      $('bugD').style.display='block'; $('bugT').value=''; btn.disabled=false;
      setTimeout(function(){ M.classList.remove('on'); $('bugD').style.display='none'; },1800);
    }
    if(MOCK){ done(); return; }
    var url=location.origin+location.pathname+location.search;
    var errs = DEBUG ? (window.__errs||[]).slice(-3).join(' | ') : '';
    fetch(SB_URL,{ method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body:JSON.stringify({ member_id:'bug_merone-cockpit', member_name:'今月の数字', mood:'バグ報告', worry:t, want:(url.slice(0,180)+' ／ '+navigator.userAgent.slice(0,140)+(errs?' ／ '+errs.slice(0,300):'')) }) })
      .then(function(){ done(); }).catch(function(){ btn.disabled=false; alert('送信できませんでした。通信環境をご確認ください。'); });
  });
  // 戻ってきた時: 日付が変わったか10分たったら読み直す
  document.addEventListener('visibilitychange', maybeReload);
  window.addEventListener('pageshow', function(e){ if(e && e.persisted) maybeReload(); });
}
function findSem(id){ var f=null; (st.settings.seminars||[]).forEach(function(s){ if(s.id===id) f=s; }); return f; }
function maybeReload(){
  if(document.visibilityState && document.visibilityState!=='visible') return;
  var now=new Date(), newDay = !MOCK && isoDate(now)!==isoDate(st.today);
  if(!newDay && Date.now()-st.lastLoadAt < 600000) return;
  if(newDay){
    st.today=now;
    var ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
    if(ym!==st.ym){
      st.ym=ym; st.stat=null; st.meta=null; st.expense=null; st.asOf=''; st.fetchedAt=0;
      st.settings=E.normalize(st.settings, ym); renderAll();
    } else render();
  }
  refresh();
}

/* ---------- ?debug=1 ---------- */
window.__dbgRender=function(){
  if(!DEBUG) return;
  var b=$('dbg'); if(!b) return;
  var es=window.__errs||[], h='<b>debug</b> エラー '+es.length+'件';
  es.forEach(function(m){ h+='<div class="e">'+esc(m)+'</div>'; });
  b.innerHTML=h; b.hidden=false; b.setAttribute('data-count', String(es.length));
};

/* ---------- 起動 ---------- */
function showFatal(html){
  var f=document.createElement('div'); f.id='fatal'; f.innerHTML=html;
  var app=document.getElementById('app'); if(app) app.insertBefore(f, app.firstChild);
}
function boot(){
  try{
    var td=new Date();
    if(MOCK){ var qt=/^(\d{4})-(\d{2})-(\d{2})$/.exec(Q.get('today')||''); td = qt ? new Date(+qt[1], +qt[2]-1, +qt[3]) : new Date(2026,10,10); }
    st.today=td; st.ym=td.getFullYear()+'-'+pad(td.getMonth()+1);
    var c=readCache();
    if(c){
      if(c.ym===st.ym){ st.stat=c.stat||null; st.meta=c.meta||null; st.expense=c.expense||null; st.asOf=c.asOf||''; st.fetchedAt=c.fetchedAt||0; }
      st.dirty=!!c.dirty; st.pending=!!c.pending; st.settingsUpdated=c.settingsUpdated||''; st.secs=(c.secs&&typeof c.secs==='object')?c.secs:{};
    }
    if(c && c.settings) st.settings=E.normalize(c.settings, st.ym);
    else {
      st.settings=E.normalize(null, st.ym);
      st.settings.seminars=clone(SEED[st.ym]||[]);
      if(SEED_SNAP[st.ym]) st.settings.snapshots[st.ym]=clone(SEED_SNAP[st.ym]);
    }
    wire();
    renderAll();
    if(!st.res.inputsReady) $('inD').open=true;
    if(MOCK) setNote('mock'); else if(st.fetchedAt) setNote('cache');
    window.__dbgRender();
  }catch(e){
    dlog('起動: '+((e&&e.message)||e));
    showFatal('<b>表示でつまずきました</b><br>右下の ↻ を押すと、この端末の記録を消して読み込み直せます。'+(DEBUG?'<br>'+esc((e&&e.message)||''):''));
  }finally{
    removeBoot();
  }
  try{ refresh(); }catch(e){ dlog('読み込み開始: '+((e&&e.message)||e)); st.loadFail='app'; setNote('fail'); }
}
if(!E || E.VERSION!==BUILD){
  window.__dbg(!E ? 'engine.js を読み込めませんでした' : 'engine.js の版ちがい: '+E.VERSION+' / '+BUILD);
  showFatal(!E ? '<b>計算部品を読み込めませんでした</b><br>電波のよい所で開き直すか、右下の ↻ を押してください。' : '<b>更新中です。開き直してください</b>');
  var bt=document.getElementById('boot'); if(bt && bt.parentNode) bt.parentNode.removeChild(bt);
  if(window.__dbgRender) window.__dbgRender();
} else boot();
})();
</script>
</body>
</html>
